name: V2 full validation
on:
  workflow_dispatch:
jobs:
  candidate-installation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --frozen
      - name: Build candidate and acquire locked native dependency wheels
        shell: python
        run: |
          import pathlib, subprocess, sys
          root = pathlib.Path.cwd()
          work = root / 'temp/build/installation-ci'
          work.mkdir(parents=True)
          subprocess.run(['uv', 'build', '--package', 'omnioperator', '--wheel', '--out-dir', str(work / 'app')], check=True)
          requirements = work / 'requirements.txt'
          subprocess.run(['uv', 'export', '--frozen', '--no-dev', '--no-emit-workspace', '--no-annotate', '--no-header', '--output-file', str(requirements)], check=True)
          subprocess.run([sys.executable, '-m', 'pip', 'download', '--require-hashes', '--only-binary=:all:', '--no-deps', '--dest', str(work / 'dependencies'), '-r', str(requirements)], check=True)
          subprocess.run(['uv', 'run', '--no-sync', 'python', 'scripts/build_v2_dependencies.py', '--wheels', str(work / 'dependencies'), '--output', str(work / 'bundle')], check=True)
      - name: Independently install and verify launcher and data-preserving uninstall
        shell: python
        run: |
          import hashlib, pathlib, subprocess, sys
          work = pathlib.Path.cwd() / 'temp/build/installation-ci'
          wheels = list((work / 'app').glob('*.whl'))
          assert len(wheels) == 1
          wheel = wheels[0]
          bundle = work / 'bundle'
          subprocess.run(['uv', 'run', '--no-sync', 'python', 'scripts/check_v2_installation.py', '--wheel', str(wheel), '--sha256', hashlib.sha256(wheel.read_bytes()).hexdigest(), '--dependency-bundle', str(bundle), '--dependency-sha256', hashlib.sha256((bundle / 'manifest.json').read_bytes()).hexdigest(), '--base-python', sys.executable, '--output', str(work / 'result')], check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-independent-installation-${{ matrix.os }}
          path: temp/build/installation-ci/result/report.json
  container-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build core image
        run: docker build -f deploy/v2/Dockerfile -t omnioperator:v2-ci .
      - name: Check non-root offline volume persistence and graceful stop
        run: python scripts/check_v2_container.py --image omnioperator:v2-ci --output temp/build/v2-container-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-container-core-proof
          path: temp/build/v2-container-ci.json
  offline-kernel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTEST_XDIST_AUTO_NUM_WORKERS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.5
      - if: runner.os == 'Windows'
        run: uv sync --frozen --all-packages --all-extras
      - if: runner.os != 'Windows'
        run: uv sync --frozen --python 3.12 --package omnioperator --extra asr
      - run: uv run --no-sync python -m playwright install --with-deps chromium
      - name: Verify Windows ownership and instance shutdown
        if: runner.os == 'Windows'
        run: >-
          uv run --no-sync pytest -q -n 0
          agent/tests/v2/operations/test_v2_private_permissions.py
          agent/tests/v2/operations/test_v2_service_runtime.py::test_identity_tracks_real_boot_and_drains_before_releasing_lock
      - name: Run the full repository test suite
        if: runner.os == 'Windows'
        run: uv run --no-sync python scripts/ci_v2.py --windows-repository
      - name: Run the portable V2 tests
        if: runner.os != 'Windows'
        run: uv run --no-sync python scripts/ci_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-tests-${{ matrix.os }}
          path: temp/build/v2-ci/pytest*.xml
  local-vectors:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --frozen --python 3.12 --package omnioperator --extra vectors
      - run: uv run --no-sync pytest -q -n 0 agent/tests/v2/integrations/test_v2_local_vectors.py agent/tests/v2/integrations/native_v2_local_vectors.py --junitxml=temp/build/local-vectors.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-vectors-${{ matrix.os }}
          path: temp/build/local-vectors.xml
  macos-native-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --frozen
      - name: Compile universal helper and verify foreground and native registration paths
        run: uv run --no-sync python agent/scripts/build_macos_helper.py --arch universal --output temp/build/macos-native-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-native-build-proof
          path: |
            temp/build/macos-native-ci/foreground-core.xml
            temp/build/macos-native-ci/registration-paths.xml
            temp/build/macos-native-ci/*.build.json
