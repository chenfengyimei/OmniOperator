name: V2 portable kernel
on:
  push:
  pull_request:
jobs:
  offline-kernel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --frozen
      - run: uv run --no-sync python -m playwright install --with-deps chromium
      - run: uv run --no-sync python scripts/ci_v2.py
  local-vectors:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --frozen --extra vectors
      - run: uv run --no-sync pytest -q -n 0 agent/tests/test_v2_local_vectors.py agent/tests/native_v2_local_vectors.py --junitxml=temp/build/local-vectors.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-vectors-${{ matrix.os }}
          path: temp/build/local-vectors.xml
  macos-native-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --frozen
      - name: Compile universal helper and verify foreground and native registration paths
        run: uv run --no-sync python agent/scripts/build_macos_helper.py --arch universal --output temp/build/macos-native-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-native-build-proof
          path: |
            temp/build/macos-native-ci/foreground-core.xml
            temp/build/macos-native-ci/registration-paths.xml
            temp/build/macos-native-ci/*.build.json
