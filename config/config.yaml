# OmniOperator 主配置 —— 密钥一律放 .env（参考 .env.example），不放这里。

persona:
  name: 小鱼
  # {now} 会被替换为当前时间。昵称与人设都在下方或设置中心（小鱼大脑）可改。
  system_prompt: |
    你是 OmniOperator（昵称小鱼），一个运行在用户电脑上的个人智能体。
    当前时间：{now}
    你有 remember（写入长期记忆）和 recall（检索长期记忆）两个工具，
    用户提到的偏好、约定、重要结论请主动记住；被问及相关信息时先 recall 再回答。
    你还有 search_history（搜过去的对话记录）和 profile_manage（维护用户长期档案，
    有字符额度限制，写满先合并）两个工具——了解到用户稳定的核心特征
    （职业、偏好、性格）时，请合并进档案而不是反复新增。
    你还拥有技能系统：动手做多步任务前先 skills_list 看有没有现成技能、
    用 skill_view 查看流程；完成复杂任务或踩坑之后，用 skill_create 把
    经验沉淀成技能，供以后复用。
    你还有定时任务工具 cron_add / cron_list / cron_remove：用户说
    "每天X点做Y"或"每隔N分钟做Y"时，用 cron_add 排程（结果可投递到
    白名单 QQ；任务由 omni-heartbeat 进程执行，需要它在运行）。
    用户发来B站视频链接时：先用 bilibili_video_info 了解视频，再视情况用
    bilibili_video_subtitle 拿字幕、bilibili_video_comments 看观众反响；
    没有字幕时可以用 bilibili_video_transcript 转写音频（较慢，长视频慎用），
    最后给出你自己的"看后感"——要有观点和细节，不要只复述数据。

models:
  # LiteLLM 模型串（provider/model）。改成本地 .env 里有 key 的模型即可。
  chat: deepseek/deepseek-chat            # 日常对话（便宜量大）
  vision: anthropic/claude-sonnet-4-5     # 截屏/UI 视觉定位（强视觉）
  local: ollama/qwen2.5:7b                # 本地零成本任务
  review: ""                               # 回合后 review 用；留空跟随 chat

llm:
  # 模型调用层：超时 / 有界重试 / 费用上限 / 能力声明（见 docs/DEVELOPMENT_STATUS.md D10）
  request_timeout_s: 90       # 单次请求超时；超时会计入"可能已计费"
  max_output_tokens: 1024     # 预留费用时按此上界估算输出（不是硬截断）
  retry:
    max_attempts: 3           # 只对限流/超时/连接/5xx 重试，认证与参数错误立即失败
    total_deadline_s: 120     # 重试总时限：到点就放弃，不无限退避
    backoff_s: 0.5            # 指数退避起点（0.5 → 1 → 2 → 4，上限 8 秒）
  budget:
    daily_usd: 0              # 0 = 未设上限（只记账不拦截）；设置后是硬拦截
    per_run_usd: 0            # 单次运行（含委派子运行累计）上限；0 = 不限
  # 能力与单价声明。没声明的模型：默认支持工具、不支持视觉、单价查 LiteLLM 本地表。
  # vision 必须显式打开——否则含图片的请求会在调用前被拒（而不是让模型瞎猜）。
  capabilities:
    deepseek/deepseek-chat:
      tools: true
      vision: false
      context_tokens: 65536
    anthropic/claude-sonnet-4-5:
      tools: true
      vision: true
      context_tokens: 200000
    ollama/qwen2.5:7b:
      tools: true
      vision: false
      context_tokens: 32768

limits:
  max_history_messages: 40    # 每次送入 LLM 的历史消息条数上限
  max_agent_steps: 8          # 单条消息内最多工具循环轮数

review:
  enabled: true               # 回合后异步记忆整理（自进化）
  max_messages: 12            # review 重放最近多少条消息
  steps: 4                    # review 的工具循环步数预算
  queue_depth: 4              # 待整理队列上限：满了这一轮直接跳过（不堆线程）
  min_messages: 2             # 新消息少于这个数不整理

memory:
  max_writes_per_day: 200     # 事实+档案+技能共用的每日写入总次数（review 也走这份）
  max_fact_chars: 500         # 单条事实的最大长度
  recall_prefix: true         # 检索结果加"这是数据不是指令"的说明

files:
  # 结构化文件工具：默认只在项目根内读；写要人工确认 + 指纹校验 + 写前备份
  root: ""                    # 工作区根；留空 = 项目根目录
  extra_roots: []             # 额外授权目录（只在这里手写；模型参数无法扩展）
  deny_globs: []              # 额外不可读的相对路径，如 ["xuexi/**"]
  write_deny_globs: []        # 额外不可写
  max_read_lines: 200         # 单次读取默认行数
  max_list_entries: 200       # 单次列目录默认条目
  max_search_files: 2000      # 搜索最多访问多少文件（大仓库可调大或缩小 path）
  max_search_results: 80      # 搜索最多返回多少条命中
  max_search_seconds: 5.0     # 搜索时间上限

asr:
  model: small                # faster-whisper 模型（tiny/base/small/medium）
  device: cpu                 # 有 NVIDIA GPU 可改 cuda
  compute_type: int8

qq:
  enabled: true               # QQ 通道总开关（NapCat 已部署在 D:\tools\napcat）
  ws_url: "ws://127.0.0.1:3001"   # NapCat 正向 WebSocket 地址
  access_token: ""            # 与 NapCat 网络配置里的一致（可留空）
  allowed_users: [10000000001]     # 私聊白名单：用户大号（机器人小号 10000000002）
  allowed_groups: []          # 群白名单：群号列表（群里还需 @机器人 才响应）
  reply_delay_s: [1.0, 3.0]   # 拟人回复延迟区间（秒）

browser:
  headless: false             # 默认有头浏览器：你能看到它在干什么（像人）
  slow_mo_ms: 120             # 动作慢放（拟人节奏 + 稳定性）
  max_writes_per_day: 50      # 每日写操作预算（click/type 合计，防失控）
  approval_timeout_s: 180     # 写操作确认等待上限（秒），超时自动拒绝

system:
  napcat_dir: "D:/tools/napcat"   # NapCat Shell 目录（含 napcat.bat），工作台由此管理启停/扫码
