# OmniOperator 主配置 —— 密钥一律放 .env（参考 .env.example），不放这里。

persona:
  name: 小欧
  # {now} 会被替换为当前时间。人设后续细化（性格/自称/与用户的关系）。
  system_prompt: |
    你是 OmniOperator（昵称小欧），一个运行在用户电脑上的个人智能体。
    当前时间：{now}
    你有 remember（写入长期记忆）和 recall（检索长期记忆）两个工具，
    用户提到的偏好、约定、重要结论请主动记住；被问及相关信息时先 recall 再回答。
    你还有 search_history（搜过去的对话记录）和 profile_manage（维护用户长期档案，
    有字符额度限制，写满先合并）两个工具——了解到用户稳定的核心特征
    （职业、偏好、性格）时，请合并进档案而不是反复新增。
    你还拥有技能系统：动手做多步任务前先 skills_list 看有没有现成技能、
    用 skill_view 查看流程；完成复杂任务或踩坑之后，用 skill_create 把
    经验沉淀成技能，供以后复用。
    你还有定时任务工具 cron_add / cron_list / cron_remove：用户说
    "每天X点做Y"或"每隔N分钟做Y"时，用 cron_add 排程（结果可投递到
    白名单 QQ；任务由 omni-heartbeat 进程执行，需要它在运行）。
    用户发来B站视频链接时：先用 bilibili_video_info 了解视频，再视情况用
    bilibili_video_subtitle 拿字幕、bilibili_video_comments 看观众反响；
    没有字幕时可以用 bilibili_video_transcript 转写音频（较慢，长视频慎用），
    最后给出你自己的"看后感"——要有观点和细节，不要只复述数据。

models:
  # LiteLLM 模型串（provider/model）。改成本地 .env 里有 key 的模型即可。
  chat: deepseek/deepseek-chat            # 日常对话（便宜量大）
  vision: anthropic/claude-sonnet-4-5     # 截屏/UI 视觉定位（强视觉）
  local: ollama/qwen2.5:7b                # 本地零成本任务
  review: ""                               # 回合后 review 用；留空跟随 chat

limits:
  max_history_messages: 40    # 每次送入 LLM 的历史消息条数上限
  max_agent_steps: 8          # 单条消息内最多工具循环轮数

review:
  enabled: true               # 回合后异步记忆整理（自进化）
  max_messages: 12            # review 重放最近多少条消息
  steps: 4                    # review 的工具循环步数预算

asr:
  model: small                # faster-whisper 模型（tiny/base/small/medium）
  device: cpu                 # 有 NVIDIA GPU 可改 cuda
  compute_type: int8

qq:
  enabled: false              # QQ 通道总开关（需先启动 NapCat，见 docs/QQ_SETUP.md）
  ws_url: "ws://127.0.0.1:3001"   # NapCat 正向 WebSocket 地址
  access_token: ""            # 与 NapCat 网络配置里的一致（可留空）
  allowed_users: []           # 私聊白名单：填你的 QQ 号，如 [123456789]（空=不响应任何人）
  allowed_groups: []          # 群白名单：群号列表（群里还需 @机器人 才响应）
  reply_delay_s: [1.0, 3.0]   # 拟人回复延迟区间（秒）
