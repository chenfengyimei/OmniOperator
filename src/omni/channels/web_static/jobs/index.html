<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小鱼 · 后台命令</title><link rel="stylesheet" href="/jobs/jobs.css"><link rel="stylesheet" href="/ui/base.css"><script src="/ui/shared.js"></script>
</head>
<body><header><a href="/">← 工作台</a><h1>agent 后台命令</h1><a href="/terminal/">人工终端</a></header><p>正常回答结束后任务可继续；停止所属回合会取消任务。服务退出时回收，重启不自动重跑。</p>
<div class="toolbar"><input id="job-search" type="search" aria-label="搜索任务" placeholder="搜索命令、任务或会话"><select id="job-filter" aria-label="任务状态"><option value="">所有状态</option><option value="active">执行中</option><option value="ended">已结束 / 待核查</option></select><button id="refresh">刷新列表</button><span id="job-count" class="ui-muted"></span></div>
<div id="status" role="status">读取任务…</div><main><nav id="jobs" aria-label="任务列表"></nav><section><h2 id="job-title">选择任务</h2><div id="detail" class="ui-muted">选择左侧任务查看状态和增量输出。</div><button id="cancel" class="ui-danger" disabled>取消任务</button><div class="output-tools"><strong>执行输出</strong><button id="reload-output" disabled>读取最新</button><button id="copy-output" disabled>复制输出</button><label><input id="follow-output" type="checkbox" checked> 跟随输出</label></div><pre id="output" tabindex="0" aria-label="任务输出"></pre></section></main><script src="/jobs/jobs.js"></script></body></html>
