<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniOperator 工作台</title>
<style>
:root{
  --bg:#0e1116; --panel:#161b23; --panel2:#1c222c; --border:#2a3240;
  --text:#dbe2ea; --dim:#8b95a5; --accent:#22d3ee;
  --user:#2563eb; --assistant:#222c3a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.6 "Segoe UI",system-ui,-apple-system,"Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
.brand{font-weight:700;font-size:15px}
.brand em{color:var(--accent);font-style:normal}
#chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:1px 10px;font-size:12px;color:var(--dim)}
.chip.ok{color:#34d399;border-color:#14532d}
main{flex:1;display:grid;grid-template-columns:230px minmax(0,1fr) 300px;gap:12px;padding:12px;min-height:0}
aside,section{min-height:0;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel-title{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-weight:600;font-size:13px;color:var(--dim);border-bottom:1px solid var(--border)}
.panel-title button{background:var(--accent);border:none;color:#03202a;border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer;font-weight:600}
.panel-title button:hover{filter:brightness(1.12)}
ul{list-style:none;overflow-y:auto}
#sessions li{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px}
#sessions li:hover{background:var(--panel2)}
#sessions li.active{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
#sessions .s-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sessions .s-id{color:var(--dim);font-size:11px;flex-shrink:0}
#status{padding:10px 12px;font-size:12.5px;color:var(--dim);line-height:2}
#status b{color:var(--text)}
#chat{background:var(--panel);border:1px solid var(--border);border-radius:10px;min-height:0}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex}
.msg.user{justify-content:flex-end}
.bubble{max-width:78%;padding:9px 13px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.msg.user .bubble{background:var(--user);border-bottom-right-radius:4px;color:#fff}
.msg.assistant .bubble{background:var(--assistant);border-bottom-left-radius:4px}
.bubble.thinking{color:var(--dim);font-style:italic}
#composer{display:flex;gap:10px;padding:12px;border-top:1px solid var(--border)}
#input{flex:1;resize:none;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 12px;font:inherit;max-height:140px}
#input:focus{outline:none;border-color:var(--accent)}
#send{background:var(--accent);border:none;color:#03202a;border-radius:8px;padding:0 22px;font-weight:700;cursor:pointer}
#send:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--border)}
.tabs button{flex:1;background:transparent;border:none;color:var(--dim);padding:5px;border-radius:6px;cursor:pointer;font-size:12.5px}
.tabs button.active{background:var(--panel2);color:var(--text)}
.tab-body{display:flex;flex-direction:column;min-height:0;flex:1}
.tab-body.hidden{display:none}
#fact-q{margin:8px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 10px;font-size:12.5px}
#fact-q:focus{outline:none;border-color:var(--accent)}
#facts-list,#profile-list,#reviews-list,#skills-list,#tools{flex:1;overflow-y:auto}
#facts-list li,#profile-list li{padding:7px 12px;border-bottom:1px solid var(--border);font-size:12.5px;line-height:1.55}
#profile-list li b{color:var(--accent);margin-right:6px}
#reviews-list li{padding:7px 12px;border-bottom:1px solid var(--border);font-size:12px;color:var(--dim)}
#reviews-list .r-meta{color:var(--accent);font-size:11px;margin-bottom:2px}
#reviews-list .r-outcome{color:var(--text)}
#profile-usage{padding:8px 12px;font-size:12px;color:var(--dim);border-bottom:1px solid var(--border)}
#profile-usage b{color:var(--text)}
#tools li{padding:6px 12px;font-size:12.5px;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border)}
.tool-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool-set{color:var(--dim);font-size:11px;flex-shrink:0}
.skill-item{padding:7px 12px;border-bottom:1px solid var(--border);font-size:12.5px;cursor:pointer}
.skill-item:hover{background:var(--panel2)}
.skill-item b{color:var(--text)}
.skill-desc{color:var(--dim);font-size:11.5px}
.skill-body{margin-top:6px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:8px;font:11.5px/1.5 Consolas,monospace;color:var(--text);white-space:pre-wrap;max-height:320px;overflow-y:auto}
.empty{color:var(--dim);text-align:center;padding:24px 10px;font-size:12.5px}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
@media (max-width:1000px){main{grid-template-columns:1fr;overflow-y:auto}aside,section{max-height:45vh}}
</style>
</head>
<body>
<header>
  <div class="brand">🦞 <em>Omni</em>Operator 工作台</div>
  <div id="chips"></div>
</header>
<main>
  <aside>
    <div class="panel" style="flex:1.2">
      <div class="panel-title"><span>会话</span><button id="new-session">＋ 新会话</button></div>
      <ul id="sessions"></ul>
    </div>
    <div class="panel" style="flex:1">
      <div class="panel-title"><span>状态</span></div>
      <div id="status"></div>
    </div>
  </aside>
  <section id="chat">
    <div id="messages"><div class="empty">选择左侧会话，或直接开始聊天</div></div>
    <div id="composer">
      <textarea id="input" rows="2" placeholder="给小欧发消息…（丢B站链接也行）"></textarea>
      <button id="send">发送</button>
    </div>
  </section>
  <aside>
    <div class="panel" style="flex:1.4">
      <div class="tabs">
        <button data-tab="facts" class="active">记忆</button>
        <button data-tab="profile">档案</button>
        <button data-tab="reviews">Review</button>
        <button data-tab="skills">技能</button>
      </div>
      <div id="tab-facts" class="tab-body">
        <input id="fact-q" placeholder="搜索事实记忆…">
        <ul id="facts-list"></ul>
      </div>
      <div id="tab-profile" class="tab-body hidden"><div id="profile-usage"></div><ul id="profile-list"></ul></div>
      <div id="tab-reviews" class="tab-body hidden"><ul id="reviews-list"></ul></div>
      <div id="tab-skills" class="tab-body hidden"><ul id="skills-list"></ul></div>
    </div>
    <div class="panel" style="flex:1">
      <div class="panel-title"><span>工具</span></div>
      <ul id="tools"></ul>
    </div>
  </aside>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let currentSession=null,busy=false;

async function api(path,opts){
  const r=await fetch(path,opts);
  if(!r.ok){let d='';try{d=(await r.json()).detail||''}catch(e){}
    throw new Error(d||r.statusText)}
  return r.json();
}

async function loadState(){
  const s=await api('/api/state');currentSession=s.session_id;
  $('#chips').innerHTML=`<span class="chip">${esc(s.persona)}</span><span class="chip">${esc(s.model)}</span>`+
    (s.fts_enabled?'<span class="chip ok">FTS5</span>':'<span class="chip">FTS ✗</span>')+
    (s.review_enabled?'<span class="chip ok">自进化 Review</span>':'');
  $('#status').innerHTML=`当前模型<br><b>${esc(s.model)}</b><br>能力域<br><b>${esc(s.toolsets.join(' / '))}</b><br>用户档案 <b>${s.profile.used}/${s.profile.max}</b> 字符`;
  $('#tools').innerHTML=s.tools.map(t=>
    `<li><span class="tool-name" title="${esc(t.description||t.name)}">${esc(t.name)}</span><span class="tool-set">${esc(t.toolset)}·${esc(t.risk)}</span></li>`).join('');
}

async function loadSessions(){
  const d=await api('/api/sessions');
  $('#sessions').innerHTML=d.sessions.map(x=>
    `<li class="${x.id===currentSession?'active':''}" onclick="selectSession(${x.id})"><span class="s-title">${esc(x.title)}</span><span class="s-id">#${x.id}</span></li>`).join('');
}
window.selectSession=async id=>{
  try{
    await api(`/api/sessions/${id}/select`,{method:'POST'});
    currentSession=id;await loadSessions();await loadMessages();
  }catch(e){alert(e.message)}
};

async function loadMessages(){
  if(currentSession==null)return;
  const d=await api(`/api/sessions/${currentSession}/messages`);
  $('#messages').innerHTML=d.messages.length?d.messages.map(m=>
    `<div class="msg ${m.role}"><div class="bubble">${esc(m.content)}</div></div>`).join(''):'<div class="empty">这个会话还没有消息</div>';
  scrollChat();
}
function scrollChat(){const el=$('#messages');el.scrollTop=el.scrollHeight}

async function sendMessage(){
  const box=$('#input'),text=box.value.trim();
  if(!text||busy)return;
  busy=true;$('#send').disabled=true;box.value='';
  $('#messages').insertAdjacentHTML('beforeend',
    `<div class="msg user"><div class="bubble">${esc(text)}</div></div>`+
    `<div class="msg assistant" id="thinking"><div class="bubble thinking">思考中…（可能正在调用工具）</div></div>`);
  scrollChat();
  try{
    const d=await api('/api/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text,session_id:currentSession})
    });
    currentSession=d.session_id;
    await loadMessages();refreshMemory();loadSessions();
  }catch(e){
    const t=$('#thinking');if(t)t.remove();
    $('#messages').insertAdjacentHTML('beforeend',
      `<div class="msg assistant"><div class="bubble">⚠ ${esc(e.message)}</div></div>`);
    scrollChat();
  }
  busy=false;$('#send').disabled=false;box.focus();
}

async function loadFacts(){
  const q=$('#fact-q').value.trim();
  const d=await api('/api/facts?q='+encodeURIComponent(q));
  $('#facts-list').innerHTML=d.facts.length?d.facts.map(f=>`<li>${esc(f)}</li>`).join(''):'<li class="empty">暂无记忆</li>';
}
async function loadProfile(){
  const d=await api('/api/profile');
  $('#profile-usage').innerHTML=`用户档案：<b>${d.usage}/${d.max}</b> 字符（由 agent 用 profile_manage 维护）`;
  $('#profile-list').innerHTML=d.lines.length?d.lines.map(l=>`<li><b>[${l.id}]</b>${esc(l.content)}</li>`).join(''):'<li class="empty">档案还是空的</li>';
}
async function loadReviews(){
  const d=await api('/api/reviews');
  $('#reviews-list').innerHTML=d.reviews.length?d.reviews.map(r=>
    `<li><div class="r-meta">会话 #${r.session_id} · ${esc((r.created_at||'').slice(5,16))}</div><div class="r-outcome">${esc(r.outcome)}</div></li>`).join(''):'<li class="empty">还没有 review 记录</li>';
}
async function loadSkills(){
  const d=await api('/api/skills');
  $('#skills-list').innerHTML=d.skills.length?d.skills.map(s=>
    `<li class="skill-item" data-open="0" onclick="toggleSkill('${esc(s.name)}',this)"><b>${esc(s.name)}</b> <span class="s-id">v${esc(s.version)}</span><div class="skill-desc">${esc(s.description)}</div></li>`).join(''):'<li class="empty">还没有技能（agent 完成多步任务后会自动沉淀）</li>';
}
window.toggleSkill=async(name,el)=>{
  const body=el.querySelector('.skill-body');
  if(body){body.remove();el.dataset.open='0';return}
  try{
    const d=await api('/api/skills/'+encodeURIComponent(name));
    const pre=document.createElement('div');pre.className='skill-body';pre.textContent=d.content;
    el.appendChild(pre);el.dataset.open='1';
  }catch(e){alert(e.message)}
};
function refreshMemory(){loadFacts();loadProfile();loadReviews();loadSkills()}

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  ['facts','profile','reviews','skills'].forEach(t=>$('#tab-'+t).classList.toggle('hidden',t!==b.dataset.tab));
});
$('#send').onclick=sendMessage;
$('#input').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}
});
$('#new-session').onclick=async()=>{
  try{const d=await api('/api/sessions',{method:'POST'});
    currentSession=d.session_id;await loadSessions();await loadMessages();
  }catch(e){alert(e.message)}
};
$('#fact-q').addEventListener('input',loadFacts);

(async function init(){
  try{await loadState();await loadSessions();await loadMessages();refreshMemory()}
  catch(e){console.error(e)}
  setInterval(()=>{loadSessions();loadReviews()},10000);
})();
</script>
</body>
</html>
