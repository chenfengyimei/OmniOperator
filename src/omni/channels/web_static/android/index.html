<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小鱼 · 安卓控制</title><link rel="stylesheet" href="/android/android.css"><link rel="stylesheet" href="/ui/base.css"><script src="/ui/shared.js"></script>
</head><body>
<header><a href="/">← 工作台</a><h1>安卓应用控制</h1><button id="detect">检测设备</button><select id="devices" aria-label="目标设备"><option value="">先检测并选择设备</option></select></header>
<p id="status" role="status">检测会访问本地 ADB；多设备必须明确选择。动作需单次观察，超时或掉线不自动重试。</p><p id="observation-state" class="ui-badge" role="status">未取得有效观察</p>
<div class="toolbar"><button id="live">实时预览</button><button id="stop-live">停止预览</button><button id="snapshot">锁定操作帧</button><button id="observe">刷新 UI 树</button><button data-key="KEYCODE_BACK">返回</button><button data-key="KEYCODE_HOME">主屏</button><button data-key="KEYCODE_APP_SWITCH">最近应用</button></div>
<main><section class="screen"><img hidden id="screen" alt="锁定的手机操作帧"><span id="frame-info">坐标点击必须先锁定操作帧。</span></section><section class="controls"><h2>元素与手势</h2><select id="elements" aria-label="目标元素"></select><div><button id="tap">点击元素</button><button id="long">长按元素</button></div><div class="toolbar"><button data-direction="up">上滑</button><button data-direction="down">下滑</button><button data-direction="left">左滑</button><button data-direction="right">右滑</button></div><label>输入文字 <input id="text" maxlength="2000" autocomplete="off"></label><button id="type">输入到当前非密码焦点</button><h2>白名单应用</h2><button id="apps">读取允许应用</button><select id="packages" aria-label="允许启动的应用"></select><button id="launch">启动所选应用</button><pre id="tree">刷新 UI 树后查看元素。</pre></section></main><script src="/android/android.js"></script></body></html>
