<body>
<!-- 左侧图标栏：fixed 定位，body 的直接子元素仍是 header / main，shared.js 的挂载假设不变 -->
<nav class="rail" aria-label="主导航">
  <div class="rail-brand" data-tip="OmniOperator"><span class="material-icons">smart_toy</span></div>
  <button class="rail-btn active" data-tip="对话工作台" onclick="railGo(this)"><span class="material-icons">forum</span></button>
  <button class="rail-btn" data-tip="记忆库" onclick="railTab(this,'facts')"><span class="material-icons">psychology</span></button>
  <button class="rail-btn" data-tip="技能库" onclick="railTab(this,'skills')"><span class="material-icons">auto_awesome</span></button>
  <button class="rail-btn" data-tip="定时任务" onclick="railCron()"><span class="material-icons">schedule</span></button>
  <div class="rail-sep"></div>
  <button class="rail-btn" data-tip="内置终端" onclick="openTerminal()"><span class="material-icons">terminal</span></button>
  <button class="rail-btn" data-tip="安卓手机" onclick="openPhone()"><span class="material-icons">smartphone</span></button>
  <button class="rail-btn" data-tip="审批队列" onclick="railApprovals()"><span class="material-icons">gpp_maybe</span></button>
  <div class="rail-sep"></div>
  <a class="rail-btn" id="open-project" href="/project/" data-tip="项目与能力" title="模块、API、工具与扩展索引"><span class="material-icons">account_tree</span></a>
  <a class="rail-btn" id="open-command-jobs" href="/jobs/" data-tip="后台命令"><span class="material-icons">checklist</span></a>
  <a class="rail-btn" id="open-mcp-services" href="/mcp/" data-tip="MCP 服务"><span class="material-icons">network_check</span></a>
  <a class="rail-btn" id="open-capabilities" href="/capabilities/" data-tip="能力诊断"><span class="material-icons">fact_check</span></a>
  <div class="rail-foot">
    <button class="rail-btn" data-tip="设置中心" onclick="openHub()"><span class="material-icons">settings</span></button>
  </div>
</nav>

<header>
  <div class="brand">
    <span class="brand-mark"><span class="material-icons">smart_toy</span></span>
    <div class="brand-text">
      <div class="brand-title"><em>Omni</em>Operator 工作台</div>
      <div class="brand-sub">本地 Agent · 记忆 · 技能 · 定时任务</div>
    </div>
  </div>
  <div id="chips"></div>
  <div class="header-spacer"></div>
  <button id="open-terminal" title="内置终端（PowerShell）：不用再开 Windows 终端窗口">⌨ 终端</button>
  <button id="open-phone" title="安卓手机：看屏 + 点击 + UI 树">📱 手机</button>
  <button class="hub-open" onclick="openHub()"><span class="material-icons">tune</span>设置中心</button>
</header>
