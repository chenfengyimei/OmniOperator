services:
  omni:
    image: omnioperator:v2-local
    build:
      context: ../..
      dockerfile: deploy/v2/Dockerfile
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    stop_grace_period: 45s
    ports:
      - "127.0.0.1:8766:8766"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=134217728,mode=1777
    volumes:
      - instance:/home/omni/.local/share/OmniOperator/v2
    command:
      - serve
      - --host
      - 0.0.0.0
      - --external-url
      - "${OMNI_EXTERNAL_URL:?Set the trusted HTTPS origin served by your reverse proxy}"
      - --stdout-logs

volumes:
  instance:
