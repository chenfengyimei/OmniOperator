[project]
name = "omnioperator"
version = "0.1.0"
description = "OmniOperator — 像人一样生活在平台里的具身个人 agent（Windows/macOS 通用）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "faster-whisper>=1.2.1",
    "litellm>=1.70,<3.0",
    "mcp>=2.3.0",
    "pillow>=13.0.0",
    "playwright>=1.64.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pywinpty>=3.1.0",
    "pyyaml>=6.0",
    "rich>=13.9",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[project.scripts]
omni = "omni.channels.cli:main"
omni-web = "omni.channels.web:main"
omni-qq = "omni.channels.qq:main"
omni-heartbeat = "omni.channels.heartbeat:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omni"]

[tool.pytest.ini_options]
testpaths = ["tests"]
