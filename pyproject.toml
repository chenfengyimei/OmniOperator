[project]
name = "omnioperator-workspace"
version = "0.1.0"
description = "OmniOperator repository workspace"
requires-python = ">=3.12"
dependencies = ["omnioperator"]

[tool.uv]
package = false

[tool.uv.sources]
omnioperator = { workspace = true }

[tool.uv.workspace]
members = ["agent"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff==0.17.3",
    "pyright==1.1.414",
    "pytest-xdist>=3.8,<4",
]

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
addopts = "-n auto --dist=loadfile --durations=10"
