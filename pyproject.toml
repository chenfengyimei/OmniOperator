[project]
name = "omnioperator-workspace"
version = "0.1.0"
description = "OmniOperator repository workspace"
requires-python = ">=3.12"
dependencies = ["omnioperator"]

[tool.uv]
package = false

[tool.uv.sources]
omnioperator = { workspace = true }

[tool.uv.workspace]
members = ["agent"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
