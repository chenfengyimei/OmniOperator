<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OmniOperator V2</title>
    <script src="/assets/ui/theme.js?v=20261102v2"></script>
    <link rel="stylesheet" href="/assets/ui/tokens.css?v=20261102v2" />
    <link rel="stylesheet" href="/assets/ui/base.css?v=20261102v2" />
    <link rel="stylesheet" href="/assets/v2/workbench.css?v=20261102v2" />
  </head>
  <body>
    <header>
      <img src="/assets/ui/brand-mark.svg" width="30" height="30" alt="" />
      <strong>OmniOperator <small>V2 开发工作台</small></strong>
      <span id="health" role="status">尚未连接</span>
      <button id="theme" type="button">切换主题</button>
    </header>
    <main>
      <aside>
        <form id="connect">
          <label>所有者令牌<input id="token" type="password" autocomplete="off" required /></label>
          <button type="submit">连接实例</button>
        </form>
        <label>Agent 空间<select id="agents" aria-label="Agent 空间"></select></label>
        <nav aria-label="工作台">
          <button type="button" data-page="chat">对话</button>
          <button type="button" data-page="memory">记忆</button>
          <button type="button" data-page="settings">设置</button>
          <button type="button" data-page="logs">诊断日志</button>
          <button type="button" data-page="audit">审计记录</button>
        </nav>
        <button id="new-session" type="button">新建对话</button>
        <div id="sessions" aria-label="历史会话"></div>
      </aside>
      <section aria-label="工作区">
        <p id="error" role="alert" hidden></p>
        <div id="approvals" aria-live="polite"></div>
        <section id="chat" class="page">
          <div id="messages" aria-live="polite">
            <p class="muted">连接实例后开始对话。模型与凭据需先在设置中配置。</p>
          </div>
          <p id="run-status" role="status"></p>
          <form id="send">
            <label>消息<textarea id="message" rows="3" required></textarea></label>
            <div class="actions">
              <button type="submit">发送</button><button id="cancel" type="button" disabled>取消运行</button>
            </div>
          </form>
        </section>
        <section id="memory" class="page" hidden>
          <h1>记忆</h1>
          <form id="remember">
            <label>人工记录<textarea id="memory-text" rows="3" required></textarea></label
            ><button type="submit">保存记忆</button>
          </form>
          <div id="memory-list"></div>
        </section>
        <section id="settings" class="page" hidden>
          <h1>运行设置</h1>
          <form id="settings-form">
            <fieldset id="settings-fields" disabled>
              <label>模型<input id="model" placeholder="例如 openai/gpt-… 或 ollama/…" /></label>
              <label>模型端点<input id="base-url" type="url" /></label>
              <label>凭据引用<input id="credential-ref" /></label>
              <label>绝对工作目录<input id="workspace" /></label>
              <label>人设<textarea id="persona" rows="5"></textarea></label>
              <button type="submit">保存设置</button><span id="saved" role="status"></span>
            </fieldset>
          </form>
          <form id="credential-form">
            <h2>保存模型凭据</h2>
            <label>引用名称<input id="secret-ref" required /></label
            ><label>凭据<input id="secret" type="password" autocomplete="off" required /></label
            ><button type="submit">保存至凭据库</button>
          </form>
        </section>
        <section id="logs" class="page" hidden>
          <h1>诊断日志</h1>
          <button id="refresh-logs" type="button">刷新</button>
          <pre id="log-list"></pre>
        </section>
        <section id="audit" class="page" hidden>
          <h1>审计记录</h1>
          <button id="refresh-audit" type="button">刷新</button>
          <pre id="audit-list"></pre>
        </section>
      </section>
    </main>
    <script type="module" src="/assets/v2/main.js?v=20261102v2"></script>
  </body>
</html>
