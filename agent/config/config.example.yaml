# OmniOperator 配置模板 —— 复制为 config.yaml 后按需修改（config.yaml 不入库，可放真实白名单）。
# 密钥一律放 .env（参考 .env.example），不放这里。所有项也都能在工作台「设置中心」修改。
# 复制命令：Copy-Item config\config.example.yaml config\config.yaml

persona:
  name: "小鱼"
  # {now} 会被替换为当前时间。昵称与人设都在下方或设置中心（小鱼大脑）可改。
  system_prompt: |
    你是 OmniOperator（昵称小鱼），一个运行在用户电脑上的个人智能体。
    你有 remember（写入长期记忆）和 recall（检索长期记忆）两个工具，
    用户提到的偏好、约定、重要结论请主动记住；被问及相关信息时先 recall 再回答。
    你还有 search_history（搜过去的对话记录）和 profile_manage（维护用户长期档案，
    有字符额度限制，写满先合并）两个工具——了解到用户稳定的核心特征
    （职业、偏好、性格）时，请合并进档案而不是反复新增。
    你还拥有技能系统：动手做多步任务前先 skills_list 看有没有现成技能、
    用 skill_view 查看流程；完成复杂任务或踩坑之后，用 skill_create 把
    经验沉淀成技能，供以后复用。
    你还有定时任务工具 cron_once / cron_add / cron_list / cron_remove：一次性闹钟和
    到点提醒用 cron_once，"每天X点做Y"或"每隔N分钟做Y"用 cron_add（结果可投递到
    白名单 QQ；任务由 omni-heartbeat 进程执行，需要它在运行）。任务已在调度模块
    持久化，不要再写常驻笔记、临时事件或事实记忆来重复记录同一个任务。
    常驻笔记只放跨会话持续有效、每轮都值得看到的约定、重要教训或当前阻断；
    临时状态、一次查询结果和过程流水不要写入常驻。
    用户发来B站视频链接时：先用 bilibili_video_info 了解视频，再视情况用
    bilibili_video_subtitle 拿字幕、bilibili_video_comments 看观众反响；
    没有字幕时可以用 bilibili_video_transcript 转写音频（较慢，长视频慎用），
    最后给出你自己的"看后感"——要有观点和细节，不要只复述数据。
    当前时间：{now}
  # 场景层（可选，D36）：只做追加，不改写上面的核心正文。留空 = 没有这一层，
  # 此时行为与旧版完全一致。核心层是底座，场景层只在对应场景下追加一段。
  # group_prompt: |
  #   群里说话简短些，一次只回一句，不要抢话。
  # private_prompt: |
  #   私聊里可以展开讲，必要时给完整步骤。

models:
  # LiteLLM 模型串（provider/model）。改成本地 .env 里有 key 的模型即可。
  # deepseek-chat / deepseek-reasoner 这两个旧名已于 2026-07-24 下线，现役是
  # deepseek-flash（V4.1 Flash，1M 上下文、能看图）与 deepseek-v4-pro。
  chat: "deepseek/deepseek-flash"           # 日常对话（便宜量大）
  vision: "anthropic/claude-sonnet-4-5"     # 截屏/UI 视觉定位（强视觉）；留空跟随 chat
  local: ollama/qwen2.5:7b                # 本地零成本任务
  review: ""                               # 回合后 review 用；留空跟随 chat
  # 能力档位（D28）：每档可选自己的模型，留空都跟随 chat。
  # 路由判定建议用便宜的小模型：它只需要输出一个 JSON。
  router: ""                               # 能力判定模型；留空跟随 review，再留空跟随 chat
  chat_mode: ""                            # chat 档位（纯聊天+只读记忆）
  retrieval_mode: ""                       # retrieval 档位（只读检索）
  agent_mode: ""                           # agent 档位（完整能力）

reasoning:
  # 推理开关与强度（D30）：每档一套。auto=不干预（沿用供应商默认，DeepSeek V4
  # 默认就开着思考且 effort=high）；off=明确关闭；low/medium/high/max=愿意等它想多久。
  # 只有 DeepSeek / OpenAI 认得这两个参数，其它供应商一律不下发（见 docs/MODEL_SETTINGS.md）。
  chat: "auto"
  vision: "auto"
  review: "auto"
  router: "auto"
  chat_mode: "auto"
  retrieval_mode: "auto"
  agent_mode: "auto"

mode_routing:
  # 回合能力档位：每个回合先判断用哪一档工具，少注入工具规格就是省 token。
  # auto=按输入自动判定；chat=纯聊天；retrieval=只读检索；agent=完整能力。
  default_mode: "auto"
  allow_escalation: true                   # 轻量档位发现需要复杂能力时，可在本回合升档一次

llm:
  # 模型调用层：超时 / 有界重试 / 费用上限 / 能力声明（见 docs/v/STATUS.md D10）
  request_timeout_s: 90       # 单次请求超时；超时会计入"可能已计费"
  max_output_tokens: 1024     # 预留费用时按此上界估算输出（不是硬截断）
  retry:
    max_attempts: 3           # 只对限流/超时/连接/5xx 重试，认证与参数错误立即失败
    total_deadline_s: 120     # 重试总时限：到点就放弃，不无限退避
    backoff_s: 0.5            # 指数退避起点（0.5 → 1 → 2 → 4，上限 8 秒）
  budget:
    daily_usd: 0              # 0 = 未设上限（只记账不拦截）；设置后是硬拦截
    per_run_usd: 0            # 单次运行（含委派子运行累计）上限；0 = 不限
    # 分口径日上限：键是通道名（cli / web / qq / cron…），值是美元。
    # 为什么需要它：总额只有一个数字时，QQ 上多聊几句就能把网页端的额度吃光；
    # 分了口径才能各自设限、互不挤占。没写的通道照常记账，只是不单独设限。
    # 口径到八成会在回答末尾提醒一次（每天每口径一次，重启不重复弹）。
    scope_daily_usd: {}
  # 能力与单价声明。没声明的模型：默认支持工具、不支持视觉、单价查 LiteLLM 本地表。
  # vision 必须显式打开——否则含图片的请求会在调用前被拒（而不是让模型瞎猜）。
  capabilities:
    deepseek/deepseek-chat:
      tools: true
      vision: false
      context_tokens: 65536
    anthropic/claude-sonnet-4-5:
      tools: true
      vision: true
      context_tokens: 200000
    ollama/qwen2.5:7b:
      tools: true
      vision: false
      context_tokens: 32768

limits:
  max_history_messages: 40    # 每次送入 LLM 的历史消息条数上限
  max_agent_steps: 8          # 单条消息内最多工具循环轮数

review:
  enabled: true               # 回合后异步记忆整理（自进化）
  max_messages: 12            # review 重放最近多少条消息
  steps: 4                    # review 的工具循环步数预算
  queue_depth: 4              # 待整理队列上限：满了这一轮直接跳过（不堆线程）
  min_messages: 2             # 新消息少于这个数不整理

memory:
  max_writes_per_day: 200     # 事实+档案+技能共用的每日写入总次数（review 也走这份）
  max_fact_chars: 500         # 单条事实的最大长度
  recall_prefix: true         # 检索结果加"这是数据不是指令"的说明

skills:
  history_keep: 50            # 每个技能保留多少条修订快照（回滚能力）
  max_write_chars: 8000       # agent 单次技能写入的正文上限（记忆闸门执行；用户手动编辑不受此限额）

journal:
  # 记忆系统的日/周/月整理（由 omni-heartbeat 进程执行；日期边界用机器本地时区）
  enabled: true
  daily_time: "23:30"         # 每天到这个时刻整理当天（错过的天会自动补）
  steps: 6                    # 单次整理的模型步数预算
  max_catchup: 3              # 每轮最多补整理几天积压（最旧优先）
  max_input_chars: 40000      # 取材截断上限（当天对话超长时保头留尾）
  max_note_chars: 6000        # 单篇笔记上限
  # 三条压缩规则留空用内置默认；想自定义就在这里写全文（设置中心可改）
  daily_prompt: ""
  weekly_prompt: ""
  monthly_prompt: ""

transcript:
  # 全量记忆两个模块的记录边界（对话全量 / 会话全量）
  max_entry_chars: 20000      # 单条对话文本上限（超长截断）
  max_tool_args_chars: 4000   # 会话全量：工具参数记录上限
  max_tool_result_chars: 4000 # 会话全量：工具结果记录上限
  retention_days: 0           # 会话全量保留天数；0 = 永久
  dialogue_retention_days: 0   # 对话全量保留天数；0 = 永久

people:
  # 核心人物模块的限额
  person_card_chars: 800      # 注入对话的人物卡体积上限
  archive_max_chars: 2000    # 每条常驻档案上限
  resident_max_chars: 1200   # 每条常驻记忆上限
  event_max_chars: 500       # 每条临时事件上限

approval:
  # 审批策略：manual=每次改动都问人；smart=辅助模型先判风险，
  # 明显安全自动放行、明显危险直接拒、拿不准仍问人（QQ 与无人值守保持 fail-closed）
  mode: "manual"

files:
  # 结构化文件工具：默认只在项目根内读；写要人工确认 + 指纹校验 + 写前备份
  root: ""                    # 工作区根；留空 = 项目根目录
  extra_roots: []             # 额外授权目录（只在这里手写；模型参数无法扩展）
  deny_globs: []              # 额外不可读的相对路径，如 ["xuexi/**"]
  write_deny_globs: []        # 额外不可写
  max_read_lines: 200         # 单次读取默认行数
  max_list_entries: 200       # 单次列目录默认条目数
  max_search_files: 2000      # 搜索最多访问多少文件（大仓库可调大或缩小 path）
  max_search_results: 80      # 搜索最多返回多少命中
  max_search_seconds: 5.0     # 搜索时间上限

web:
  # 通用网页读取：公网 http/https，有界抓取；内容一律当"不可信数据"交给模型
  max_bytes: 2000000          # 响应体最多读多少字节（超出即停，不落盘）
  max_chars: 8000             # 默认返回多少字符正文
  max_links: 10               # 默认返回多少条链接
  timeout_s: 15               # 单次连接/读取超时
  total_deadline_s: 30        # 含重定向的总时限
  max_redirects: 5            # 最多跟随几次（每一跳都重新解析并校验目标）
  allow_private_hosts: []     # 唯一能放开内网的口子：写 "host" 或 "host:port"
  user_agent: ""              # 留空用内置 UA（不伪装成浏览器）

asr:
  model: "small"                # faster-whisper 模型（tiny/base/small/medium）
  device: "cpu"                 # 有 NVIDIA GPU 可改 cuda
  compute_type: "int8"

qq:
  enabled: true               # QQ 通道总开关（需先部署 NapCat，见 docs/v/reference/QQ_SETUP.md）
  ws_url: "ws://127.0.0.1:3001"   # NapCat 正向 WebSocket 地址
  access_token: ""            # 与 NapCat 网络配置里的一致（可留空）
  allowed_users: []           # 私聊白名单：允许私聊机器人的 QQ 号列表。留空 = 拒绝所有人（fail-closed）。例：[123456789]
  allowed_groups: []          # 群白名单：群号列表（群里还需 @机器人 才响应）
  reply_delay_s: [1, 3]   # 拟人回复延迟区间（秒）
  group_reply_to_bot: false
  proactive_enabled: false
  owner_qq: 0
  proactive_daily_limit: 5
  proactive_cooldown_minutes: 20   # 通道层冷却位（P5-e）：收到消息后 N 分钟内不主动搭话。
                                    # 只压「我方主动发起」（定时投递/主动私聊/将来的概率唤醒），
                                    # 不压「被叫到就回应」——用户在跟机器人说话时照常回。
                                    # 0 = 关闭。对齐 surfcore conversation-closure 的 20 分钟。
  quiet_start: "22:00"
  quiet_end: "08:00"
  timezone: "Asia/Shanghai"

browser:
  headless: false             # 默认有头浏览器：你能看到它在干什么（像人）
  slow_mo_ms: 120             # 动作慢放（拟人节奏 + 稳定性）
  max_writes_per_day: 50      # 每日写操作预算（click/type 合计，防失控）
  approval_timeout_s: 180     # 写操作确认等待上限（秒），超时自动拒绝

system:
  napcat_dir: "D:/tools/napcat"   # NapCat Shell 目录（含 napcat.bat），工作台由此管理启停/扫码；安装器会写为实际解包目录
  # 常驻服务守护：工作台启动即拉起心跳调度 / QQ 通道 / NapCat，并一直盯着
  autostart: true                 # 关掉=回到"只显示状态、要手动启动"
  keep_running_after_exit: true   # 关掉工作台后服务继续跑（定时任务不中断）；false=连带停止
  supervise_interval_s: 10        # 守护轮询间隔（2–120 秒）
  restart_max_attempts: 5         # 连续启动失败上限（0 = 不自动拉起）
  restart_backoff_cap_s: 300      # 退避封顶秒数（5、10、20… 到这个值为止）
  health_timeout_s: 45            # 服务自报运行态多久没更新就算"无响应"
  napcat_qq: ""                   # 启动 NapCat 用的 QQ 号；空则回退 owner_qq / 上次登录的 uin

updates:
  channel: stable                # stable=正式发行版；development=主动跟随 master 固定提交
  auto_check: true               # 启动后延迟检查，每天最多自动检查一次；安装仍需人工确认

# 图像只在显式授权后附加到模型请求
vision:
  send_to_cloud: false
  max_image_bytes: 4194304
  max_images_per_turn: 4
  max_edge_px: 1280
artifacts:
  retention_days: 7
  max_total_mb: 500

desktop:
  enabled: false
  foreground_enabled: false  # 启用后仍须逐次人工批准，用户输入时暂停
  allowed_apps: []           # 完整exe路径，空列表拒绝全部

mcp:
  servers: {}               # 默认stdio；远程Streamable HTTP/OAuth示例见docs/MCP.md
