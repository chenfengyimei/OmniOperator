<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小鱼 · 后台命令</title><script src="/ui/theme.js?v=20261031a"></script><link rel="stylesheet" href="/ui/tokens.css?v=20261031a"><link rel="stylesheet" href="/ui/base.css?v=20261031c"><link rel="stylesheet" href="/ui/icons.css?v=20261029"><link rel="stylesheet" href="/ui/components.css?v=20261031e"><link rel="stylesheet" href="/ui/frame.css?v=20261031d"><link rel="stylesheet" href="/jobs/jobs.css?v=20261030b"><script src="/ui/shared.js?v=20261031m6"></script>
</head>
<body data-ui-page="jobs">
<header>
  <a href="/">← 工作台</a>
  <h1>后台命令</h1>
  <a class="header-action" href="/terminal/"><span class="material-icons">terminal</span>人工终端</a>
</header>
<p>追踪 agent 启动的后台命令、增量输出和副作用状态。任务在正常回答结束后仍可继续；服务退出时回收，重启不会自动重跑。</p>
<section class="console-toolbar jobs-toolbar">
  <div class="search-field"><span class="material-icons">search</span><input id="job-search" type="search" aria-label="搜索任务" placeholder="搜索命令、任务或会话"></div>
  <select id="job-filter" aria-label="任务状态"><option value="">所有状态</option><option value="active">执行中</option><option value="ended">已结束 / 待核查</option></select>
  <button id="refresh"><span class="material-icons">refresh</span>刷新</button>
</section>
<div id="status" role="status">读取任务…</div>
<div id="job-stats" class="metric-grid" aria-label="任务概览"></div>
<main class="jobs-layout">
  <section class="jobs-list-pane">
    <div class="section-heading">
      <div><span class="eyebrow">COMMAND QUEUE</span><h2>任务队列</h2></div>
      <span id="job-count" class="section-meta">0 / 0</span>
    </div>
    <nav id="jobs" aria-label="任务列表"><div class="empty">正在读取任务…</div></nav>
  </section>
  <section class="jobs-detail-pane">
    <div class="section-heading compact">
      <div><span class="eyebrow">RUN INSPECTOR</span><h2 id="job-title">选择任务</h2></div>
      <span class="material-icons">terminal</span>
    </div>
    <div id="detail" class="ui-muted">选择左侧任务查看状态和增量输出。</div>
    <div class="detail-actions"><button id="cancel" class="ui-danger" disabled><span class="material-icons">stop_circle</span>取消任务</button></div>
    <div class="output-tools"><strong><span class="material-icons">subject</span>执行输出</strong><button id="reload-output" disabled>读取最新</button><button id="copy-output" disabled>复制输出</button><label><input id="follow-output" type="checkbox" checked> 跟随输出</label></div>
    <pre id="output" tabindex="0" aria-label="任务输出">选择任务后在此查看增量输出。</pre>
  </section>
</main>
<script type="module" src="/jobs/jobs.js?v=20261031m5"></script></body></html>
