[project]
name = "omnioperator"
version = "0.1.0"
description = "OmniOperator — 像人一样生活在平台里的具身个人 agent（Windows/macOS 通用）"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "OmniOperator contributors" }]
requires-python = ">=3.12"
keywords = ["agent", "personal-agent", "llm", "qq", "bilibili", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.162.0",
    "faster-whisper>=1.2.1",
    "litellm>=1.70,<3.0",
    "mcp>=2.3.0",
    "pillow>=13.0.0",
    "playwright>=1.64.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pywinpty>=3.1.0",
    "pyyaml>=6.0",
    "rich>=13.9",
    "sqlite-vec>=0.1.9",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[project.scripts]
omni = "omni.channels.cli:main"
omni-web = "omni.channels.web:main"
omni-qq = "omni.channels.qq:main"
omni-heartbeat = "omni.channels.heartbeat:main"

[project.urls]
Homepage = "https://gitee.com/chenfengloveyuri/OmniOperator"
Repository = "https://gitee.com/chenfengloveyuri/OmniOperator"
Issues = "https://gitee.com/chenfengloveyuri/OmniOperator/issues"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-xdist>=3.8,<4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
ignore-vcs = true
exclude = ["**/__pycache__/**", "**/*.pyc", "**/.pytest_cache/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/omni"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --dist=loadfile --durations=10"

[tool.hatch.build.targets.sdist]
include = ["src/omni", "tests", "scripts/*.py", "scripts/ci.ps1", "scripts/README.md", "config/config.example.yaml", "config/README.md", "README.md", "LICENSE", "pyproject.toml"]
